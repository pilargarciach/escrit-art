<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construcción de artículo científico</title>
<style>
:root{--navy:#0E1B2A;--beige:#E7EDF2;--card:#fff;--line:#c4cfda;--mut:#4a5a6b}
*{box-sizing:border-box}
body{margin:0;font:17px/1.65 Georgia,"Times New Roman",serif;background:var(--beige);color:var(--navy)}
header{background:var(--navy);color:var(--beige);padding:22px 20px}
header h1{margin:0;font-size:1.5rem;font-weight:600}
header p{margin:4px 0 0;font:.9rem system-ui,sans-serif;opacity:.8}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--navy);padding:0 12px;position:sticky;top:0;z-index:5}
nav button{font:.85rem system-ui,sans-serif;white-space:nowrap;border:0;background:none;color:var(--beige);opacity:.65;padding:11px 12px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{opacity:1;border-color:var(--beige);font-weight:700}
nav button:focus-visible,.btn:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #5b9bd5;outline-offset:2px}
main{max-width:820px;margin:0 auto;padding:26px 18px 40px}
h2{font-size:1.7rem;margin:.2em 0 .5em}
h3{font-size:1.1rem;margin:1.3em 0 .3em}
.box{background:var(--card);border-left:5px solid var(--navy);padding:14px 18px;margin:16px 0;border-radius:0 6px 6px 0}
.note{background:#d5dfe9;padding:10px 14px;border-radius:6px;font-size:.93rem}
label{display:block;font:600 .92rem system-ui,sans-serif;margin:16px 0 4px}
textarea,input,select{width:100%;font:1rem/1.5 Georgia,serif;padding:10px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--navy)}
textarea{min-height:110px;resize:vertical}
.cnt{font:.82rem system-ui,sans-serif;color:var(--mut);text-align:right}
.cnt.over{color:#a4262c;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}
.btn{font:600 .95rem system-ui,sans-serif;background:var(--navy);color:var(--beige);border:2px solid var(--navy);padding:11px 22px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:none;color:var(--navy)}
.btn.big{font-size:1.1rem;padding:14px 30px}
a{color:#0b4f8a}
ul{padding-left:22px}
footer{background:var(--navy);color:var(--beige);text-align:center;padding:20px;font:.88rem system-ui,sans-serif}
footer a{color:#fff}
</style>
</head>
<body>
<header><h1>Construcción de artículo científico</h1><p>Asistente paso a paso para estructurar tu artículo o tesis</p></header>
<nav id="nav" aria-label="Pestañas"></nav>
<main id="main"></main>
<footer>© Elaborado por María del Pilar García Chitiva, 2026. Todos los derechos reservados.<br><a href="https://pilargarciach.github.io/mpgch_research-literacy/" target="_blank" rel="noopener">pilargarciach.github.io/mpgch_research-literacy</a></footer>
<script>
const L=(u,t)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
// n: número de sección en el Word (0 = sin número)
const S=[
{id:'inicio',t:'Inicio',n:0,doc:'Datos de partida',h:`
<p>Una <b>comunicación científica</b> es el texto con el que un investigador presenta a la comunidad académica un problema, el modo en que lo estudió, lo que encontró y por qué importa. Debe ser clara, verificable, original y estar respaldada por fuentes confiables. Puede ser un artículo (de investigación, de revisión o de reflexión) o una tesis doctoral.</p>
<h3>Estructura de un texto de investigación</h3>
<p>Tanto en un artículo como en una tesis, el texto sigue una lógica común: <b>Título, Abstract y Palabras clave; Introducción; Marco teórico o background; Metodología; Resultados; Discusión; Conclusiones; Limitaciones y recomendaciones para futuros estudios; Referencias</b>. La tesis desarrolla cada parte con más extensión, y el artículo la condensa según las normas de la revista.</p>
<div class="box"><b>Primero, elige tu revista.</b> ${L('https://www.scimagojr.com/','SCImago Journal &amp; Country Rank (SJR)')} te permite buscar revistas por área temática, cuartil, país e impacto, e identificar cuál se ajusta al tema que quieres publicar. Revisa también sus normas para autores (extensión, formato del abstract, estilo de citación).</div>`,
f:[['Tema de investigación','t'],['Revista objetivo (según SCImago)','i'],['Tipo de artículo','s',['Resultados de investigación','Revisión','Reflexión']]],btn:'Manos a la obra'},
{id:'titulo',t:'Título',n:0,doc:'Título',h:`
<p>El título es la primera (y a veces la única) parte que se lee. Debe ser <b>informativo, preciso y breve</b> (idealmente 10 a 15 palabras), sin abreviaturas ni jerga innecesaria.</p>
<ul><li>Incluye las <b>variables o categorías</b> centrales, la <b>población o contexto</b> y, si aplica, el <b>enfoque o método</b>.</li><li>Estructura sugerida: <i>Concepto principal + relación o acción + población/contexto (+ método)</i>.</li><li>Evita frases como “Estudio sobre…” o “Análisis de…” si no aportan información.</li></ul><p>Debajo del título se registran los <b>datos del autor</b>: nombres y apellidos, ORCID, afiliación institucional y su ubicación (dirección, código postal, ciudad y país). Si no tienes ORCID, puedes crearlo gratis en orcid.org.</p>`,
f:[['Escribe el título de tu artículo','i'],['Nombres y apellidos del autor','i'],['ORCID (ej. https://orcid.org/0000-0000-0000-0000)','i'],['Afiliación (institución)','i'],['Dirección de la institución','i'],['Código postal','i'],['Ciudad','i'],['País','i']]},
{id:'abstract',t:'Abstract',n:0,doc:'Abstract',h:`
<p><b>Función:</b> resumir de forma autónoma el trabajo para que el lector decida si lo lee completo y para que los buscadores lo indexen.</p>
<h3>Abstract estructurado</h3><p>Se divide en rótulos: <i>Objetivo, Método, Resultados, Conclusiones</i> (a veces Contexto). Es habitual en ciencias de la salud, ingenierías y muchas revistas indexadas.</p>
<h3>Abstract compendiado</h3><p>Es un solo párrafo continuo que integra en orden el propósito, el método, los hallazgos principales y la conclusión.</p>
<div class="note"><b>Nota:</b> el límite sugerido es de hasta <b>150 palabras</b>, pero el número de palabras del abstract puede variar según la revista. Verifica las normas para autores.</div>`,
f:[['Abstract','a']]},
{id:'claves',t:'Palabras clave',n:0,doc:'Palabras clave',h:`
<p>Las palabras clave sirven para <b>indexar y recuperar</b> tu artículo en bases de datos y buscadores. Suelen ser de 4 a 6, representan los conceptos centrales (no repiten el título textualmente) y conviene tomarlas de <b>tesauros controlados</b>.</p>
<p>Tesauros para seleccionarlas:</p>
<ul><li>${L('https://www.ieee.org/publications/services/thesaurus.html','IEEE Thesaurus')} (ingeniería y tecnología)</li><li>${L('https://vocabularies.unesco.org/browser/thesaurus/es/','Tesauro de la UNESCO')} (educación, ciencias sociales, cultura)</li><li>${L('https://elsst.ukdataservice.ac.uk/','ELSST – European Language Social Science Thesaurus')} (ciencias sociales)</li></ul>`,
f:[['Palabras clave (separadas por comas)','i']]},
{id:'intro',t:'Introducción',n:1,doc:'Introducción',h:`
<p>La introducción tiene forma de <b>reloj de arena</b>: parte de lo amplio, se estrecha hasta el problema concreto y vuelve a abrirse hacia el lector.</p>
<ul><li><b>Contexto general:</b> el tema, su relevancia y datos o antecedentes clave.</li><li><b>Brecha:</b> lo que la literatura no ha resuelto o ha estudiado de forma insuficiente.</li><li><b>Preguntas de investigación:</b> las interrogantes que guían el estudio y que se derivan de la brecha; deben ser claras, concretas y coherentes con el objetivo.</li><li><b>Objetivo o contribución:</b> qué hace tu estudio para llenar esa brecha.</li><li><b>Metodología:</b> brevemente, cómo se abordó.</li><li><b>Agenda del estudio:</b> cómo se organiza el resto del texto.</li></ul>`,
f:[['Contexto general','a'],['Brecha','a'],['Preguntas de investigación','a'],['Objetivo o contribución','a'],['Metodología (breve)','a'],['Agenda del estudio','a']]},
{id:'marco',t:'Marco teórico',n:2,doc:'Marco teórico o background',h:`
<p>Presenta los conceptos, teorías y antecedentes que sustentan el estudio. Puede organizarse por <b>variables</b>, por <b>categorías o temas</b>, o con la lógica que el autor considere más clara. Lo esencial: <b>deben estar cubiertos todos los aspectos, variables o categorías que luego se abordan en la metodología</b>, porque serán la base de la discusión.</p>`,
f:[['Variables, categorías o temas que desarrollarás','a'],['Desarrollo del marco teórico (un apartado por variable, categoría o tema)','a']]},
{id:'metodo',t:'Metodología',n:3,doc:'Metodología',h:`
<p>Explica con detalle suficiente para que otro investigador pueda replicar o evaluar el estudio. Describe el enfoque y diseño, los participantes o la muestra, las técnicas e instrumentos, el procedimiento, el análisis y las consideraciones éticas.</p>
<h3>Estudio cuantitativo</h3><p>Diseño (experimental, correlacional, descriptivo…), hipótesis, población y muestreo, variables, instrumentos con su validez y confiabilidad, y técnicas estadísticas.</p>
<h3>Estudio cualitativo</h3><p>Enfoque (fenomenológico, etnográfico, estudio de caso…), contexto y participantes, criterios de selección, técnicas de recolección (entrevistas, observación, documentos), análisis (codificación, categorías) y criterios de rigor (credibilidad, transferibilidad).</p>
<h3>Estudio mixto</h3><p>Justifica el diseño (convergente, explicativo secuencial, exploratorio secuencial) y explica cómo se integran los datos.</p>`,
f:[['Enfoque','s',['Cuantitativo','Cualitativo','Mixto','Revisión de literatura']],['Diseño y participantes o muestra','a'],['Técnicas e instrumentos','a'],['Procedimiento, análisis y ética','a']]},
{id:'result',t:'Resultados',n:4,doc:'Resultados',h:`
<p>Presenta lo que encontraste, sin interpretarlo. Organízalo en el mismo orden de las <b>preguntas de investigación, los objetivos o las hipótesis</b>. Usa <b>tablas y figuras de forma estratégica</b>, y acompáñalas de una <b>narrativa sencilla, clara e informativa que no repita</b> lo que ya muestran las tablas o los gráficos: destaca lo importante, las tendencias y las excepciones.</p>`,
f:[['Resultados (organizados por pregunta, objetivo o hipótesis)','a'],['Tablas y figuras previstas (qué mostrará cada una)','a']]},
{id:'discusion',t:'Discusión',n:5,doc:'Discusión',h:`
<p>Aquí interpretas tus resultados <b>a la luz de la teoría y los antecedentes</b> del marco teórico. Es la parte donde se demuestra el análisis del autor: no basta repetir resultados; hay que explicar qué significan, si coinciden o contrastan con otros estudios, y por qué. Estrategia sugerida: para cada hallazgo, (1) enúncialo, (2) contrástalo con autores del marco teórico, (3) interprétalo y (4) señala su aporte.</p>`,
f:[['Discusión','a']]},
{id:'concl',t:'Conclusiones',n:6,doc:'Conclusiones',h:`
<p>Cierran el artículo respondiendo a lo planteado. Escribe <b>al menos una conclusión por cada objetivo o pregunta de investigación</b>, o por cada hallazgo principal. Deben ser breves, derivarse de los resultados y no introducir información nueva.</p>`,
f:[['Conclusiones','a']]},
{id:'limit',t:'Limitaciones',n:7,doc:'Limitaciones y recomendaciones para futuros estudios',h:`
<p>Es un apartado muy importante: muestra honestidad científica y abre la agenda de investigación. Registra las <b>principales limitaciones</b> y convierte cada una en una <b>recomendación</b>.</p>
<div class="box"><b>Ejemplo:</b> si el estudio se hizo solo en una institución o comunidad, los resultados describen lo que ocurre de manera local y situada, y no pueden generalizarse. Esa es una limitación de alcance. La recomendación: <i>futuros estudios podrían replicar esta investigación en otros contextos similares o diferentes</i>.</div>
<p>Otras limitaciones frecuentes: tamaño o tipo de muestra, instrumentos, tiempo, diseño transversal, acceso a datos.</p>`,
f:[['Limitaciones del estudio','a'],['Recomendaciones para futuros estudios','a']]},
{id:'refs',t:'Referencias',n:0,doc:'Referencias',h:`
<p>Reúne <b>todas</b> las fuentes citadas. Deben ser <b>actualizadas (no mayores a 5 años)</b>; solo excepcionalmente se aceptan más antiguas si son <b>fuentes seminales</b> o fundamentales para el estudio. Se redactan en <b>normas APA 7</b>.</p>
<h3>Estructura APA 7</h3>
<ul><li><b>Artículo:</b> Apellido, A. A., &amp; Apellido, B. B. (año). Título del artículo. <i>Nombre de la Revista, volumen</i>(número), páginas. https://doi.org/xxxx</li><li><b>Libro:</b> Apellido, A. A. (año). <i>Título del libro</i> (ed.). Editorial.</li><li><b>Capítulo:</b> Apellido, A. A. (año). Título del capítulo. En B. B. Editor (Ed.), <i>Título del libro</i> (pp. xx–xx). Editorial.</li></ul>
<p>Orden alfabético, sangría francesa, citas en el texto (Apellido, año).</p>
<h3>Número orientativo de referencias</h3>
<ul><li><b>Artículos de revisión:</b> al menos 50.</li><li><b>Artículos de reflexión:</b> al menos 30 a 35.</li><li><b>Artículos de resultados de investigación:</b> según las fuentes usadas; suelen ser más de 30, o 40.</li></ul>`,
f:[['Lista de referencias (APA 7)','a']]},
{id:'desc',t:'Descargar',n:0,h:`<p>Revisa que cada pestaña esté completa. Al descargar, obtendrás un archivo de Word llamado <b>Construcción de artículo científico</b>, donde cada pestaña aparece como un subtítulo. Introducción a Limitaciones y recomendaciones están numeradas del 1 al 7.</p><div class="note" id="est"></div>`}
];
const D={};let cur=0;
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const wc=s=>(s.trim().match(/\S+/g)||[]).length;
function nav(){document.getElementById('nav').innerHTML=S.map((s,i)=>`<button class="${i==cur?'on':''}" onclick="go(${i})">${s.n?s.n+'. ':''}${s.t}</button>`).join('')}
function go(i){cur=i;render();window.scrollTo(0,0)}
function render(){
 const s=S[cur];let h=`<h2>${s.n?s.n+'. ':''}${s.t}</h2>${s.h}`;
 if(s.f){h+=`<h3>${s.id=='inicio'?'Tus datos':'Tu turno'}</h3>`;
  s.f.forEach((f,j)=>{const k=s.id+j,v=esc(D[k]);
   h+=`<label for="${k}">${f[0]}</label>`;
   if(f[1]=='s')h+=`<select id="${k}" onchange="D['${k}']=this.value"><option value="">Selecciona…</option>${f[2].map(o=>`<option${D[k]==o?' selected':''}>${o}</option>`).join('')}</select>`;
   else if(f[1]=='i')h+=`<input id="${k}" value="${v}" oninput="D['${k}']=this.value">`;
   else h+=`<textarea id="${k}" oninput="D['${k}']=this.value;cnt('${k}')">${v}</textarea>`+(s.id=='abstract'?`<div class="cnt" id="c${k}"></div>`:'');
  });}
 if(s.id=='inicio')h+=`<div class="row"><span></span><button class="btn big" onclick="go(1)">Manos a la obra</button></div>`;
 else if(s.id=='desc')h+=`<div class="row"><button class="btn sec" onclick="go(cur-1)">Anterior</button><button class="btn big" onclick="dl()">Descargar en Word</button></div>`;
 else h+=`<div class="row"><button class="btn sec" onclick="go(cur-1)">Anterior</button><button class="btn" onclick="go(cur+1)">Siguiente</button></div>`;
 document.getElementById('main').innerHTML=h;nav();
 if(s.id=='abstract')cnt('abstract0');
 if(s.id=='desc')document.getElementById('est').innerHTML=S.filter(x=>x.doc).map(x=>{const f=x.f.some((_,j)=>(D[x.id+j]||'').trim());return (f?'✔ ':'○ ')+x.doc}).join('<br>');
}
function cnt(k){const e=document.getElementById('c'+k);if(!e)return;const n=wc(D[k]||'');e.textContent=n+' / 150 palabras (sugerido)';e.className='cnt'+(n>150?' over':'')}
function dl(){
 let b='<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Construcción de artículo científico</title><style>body{font-family:Times New Roman;font-size:12pt;line-height:1.5}h1{text-align:center;color:#0E1B2A}h2{color:#0E1B2A;font-size:15pt}h3{font-size:12pt}p{text-align:justify}</style></head><body><h1>Construcción de artículo científico</h1>';
 S.filter(s=>s.doc).forEach(s=>{
  b+=`<h2>${s.n?s.n+'. ':''}${s.doc}</h2>`;
  if(s.id=='titulo'){const g=j=>esc((D['titulo'+j]||'').trim());const c=t=>t?`<p style="text-align:center;margin:0">${t}</p>`:'';
   b+=c(g(0)&&'<b>'+g(0)+'</b>')+c(g(1))+c(g(2)&&'ORCID: '+g(2))+c(g(3))+c([g(4),g(5),g(6),g(7)].filter(x=>x).join(', '));return}
  s.f.forEach((f,j)=>{const v=(D[s.id+j]||'').trim();if(!v)return;
   if(s.f.length>1)b+=`<h3>${f[0]}</h3>`;
   b+=s.id=='refs'?v.split('\n').filter(x=>x.trim()).map(x=>`<p style="margin-left:36pt;text-indent:-36pt">${esc(x)}</p>`).join(''):v.split('\n').filter(x=>x.trim()).map(x=>`<p>${esc(x)}</p>`).join('')});
 });
 b+='<p style="text-align:center;font-size:9pt">© Elaborado por María del Pilar García Chitiva, 2026. Todos los derechos reservados. https://pilargarciach.github.io/mpgch_research-literacy/</p></body></html>';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',b],{type:'application/msword'}));a.download='Construcción de artículo científico.doc';a.click();
}
render();
</script>
</body>
</html>
